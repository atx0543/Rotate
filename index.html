<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BALLROOM ROTATION LAB - 回転量ビジュアライザー</title>
<style>
  :root {
    --bg-dark: #0b0f17;
    --card-bg: #131926;
    --sub-card-bg: #1a2234;
    --border-color: #252f44;
    --accent-teal: #2dd4bf;
    --accent-teal-dim: rgba(45, 212, 191, 0.15);
    --accent-orange: #f97316;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    height: 100dvh; /* スマホのアドレスバーを考慮した画面いっぱい表示 */
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    overflow: hidden;
  }

  .app-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 500px;
    margin: 0 auto;
    padding: 12px 14px 16px;
  }

  /* ヘッダー */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-color);
    flex-shrink: 0;
  }

  .brand-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent-teal);
  }

  .app-subtitle {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-main);
  }

  /* メインカード（縦いっぱいに伸ばす） */
  .main-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 14px;
    margin-top: 10px;
    min-height: 0;
  }

  .card-top-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent-teal);
    flex-shrink: 0;
  }

  /* 円グラフエリア（余白に合わせて拡大） */
  .visualizer-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 4px 0;
  }

  .start-dir-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .svg-wrapper {
    width: 100%;
    height: 100%;
    max-height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  svg {
    width: 100%;
    height: 100%;
    max-width: 280px;
    max-height: 280px;
    overflow: visible;
  }

  /* 角度表示とバッジ */
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0 12px;
    flex-shrink: 0;
  }

  .degree-display {
    font-size: 38px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .status-badge {
    background-color: var(--accent-teal-dim);
    border: 1px solid var(--accent-teal);
    color: var(--accent-teal);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
  }

  /* スライダーボックス */
  .control-box {
    background-color: var(--sub-card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  .box-header {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: #2b354b;
    border-radius: 3px;
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffffff;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }

  /* 下部2カラムコントロール */
  .bottom-grid {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 10px;
    flex-shrink: 0;
  }

  .grid-box {
    background-color: var(--sub-card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 11px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .grid-box-title {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .fraction-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .dir-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    height: 100%;
  }

  button {
    background-color: #131926;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    padding: 10px 4px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  button.active {
    background-color: var(--accent-teal-dim);
    border-color: var(--accent-teal);
    color: var(--accent-teal);
  }

  .dir-grid button {
    padding: 12px 4px;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="brand-title">BALLROOM ROTATION LAB</div>
    <div class="app-subtitle">回転量ビジュアライザー</div>
  </header>

  <main class="main-card">
    <div class="card-top-label">LIVE ROTATION</div>

    <div class="visualizer-area">
      <div class="start-dir-label">開始方向・0°</div>
      <div class="svg-wrapper">
        <svg viewBox="-145 -145 290 290" id="dialSvg">
          <!-- 外周円 -->
          <circle cx="0" cy="0" r="105" fill="none" stroke="#2d374d" stroke-width="1.5" />
          <!-- 目盛りとラベルはJSで生成 -->
          <g id="ticksGroup"></g>
          <!-- 扇形 -->
          <path id="sectorPath" fill="rgba(45, 212, 191, 0.22)" />
          <!-- 円弧のハイライト -->
          <path id="arcPath" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" />
          <!-- 開始線（0度） -->
          <line x1="0" y1="0" x2="0" y2="-105" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
          <!-- 終了線（回転後） -->
          <line id="endLine" x1="0" y1="0" x2="-74.2" y2="-74.2" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" />
          <!-- 中心点 -->
          <circle cx="0" cy="0" r="5" fill="#ffffff" />
        </svg>
      </div>
    </div>

    <div>
      <div class="status-row">
        <div class="degree-display" id="degreeText">45°</div>
        <div class="status-badge" id="badgeText">1/8 ・ 左回転</div>
      </div>

      <div class="control-box">
        <div class="box-header">
          <span>角度スライダー (0° - 360°)</span>
          <span>5°刻み</span>
        </div>
        <input type="range" id="angleSlider" min="0" max="360" step="5" value="45">
      </div>

      <div class="bottom-grid">
        <div class="grid-box">
          <div class="grid-box-title">回転量 (1回転に対する割合)</div>
          <div class="fraction-grid" id="fractionBtns">
            <button data-deg="45" class="active">1/8</button>
            <button data-deg="90">1/4</button>
            <button data-deg="135">3/8</button>
            <button data-deg="180">1/2</button>
            <button data-deg="225">5/8</button>
            <button data-deg="270">3/4</button>
            <button data-deg="315">7/8</button>
            <button data-deg="360">1周</button>
          </div>
        </div>

        <div class="grid-box">
          <div class="grid-box-title">回転方向</div>
          <div class="dir-grid">
            <button id="btnLeft" class="active">左回転 (L)</button>
            <button id="btnRight">右回転 (R)</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  let currentDeg = 45;
  let direction = 'L'; // 'L' = 左回転(反時計回り), 'R' = 右回転(時計回り)

  const radius = 105;
  const ticksGroup = document.getElementById('ticksGroup');
  const sectorPath = document.getElementById('sectorPath');
  const arcPath = document.getElementById('arcPath');
  const endLine = document.getElementById('endLine');
  const degreeText = document.getElementById('degreeText');
  const badgeText = document.getElementById('badgeText');
  const angleSlider = document.getElementById('angleSlider');
  const fractionBtns = document.querySelectorAll('#fractionBtns button');
  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');

  const fractionMap = {
    45: '1/8',
    90: '1/4',
    135: '3/8',
    180: '1/2',
    225: '5/8',
    270: '3/4',
    315: '7/8',
    360: '1周'
  };

  // 目盛りと角度ラベルの描画
  function initDial() {
    for (let deg = 0; deg < 360; deg += 45) {
      const rad = (deg - 90) * Math.PI / 180;
      const x1 = Math.cos(rad) * (radius - 6);
      const y1 = Math.sin(rad) * (radius - 6);
      const x2 = Math.cos(rad) * radius;
      const y2 = Math.sin(rad) * radius;

      const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      tick.setAttribute('x1', x1);
      tick.setAttribute('y1', y1);
      tick.setAttribute('x2', x2);
      tick.setAttribute('y2', y2);
      tick.setAttribute('stroke', '#475569');
      tick.setAttribute('stroke-width', '1.5');
      ticksGroup.appendChild(tick);

      const lx = Math.cos(rad) * (radius + 20);
      const ly = Math.sin(rad) * (radius + 20);
      const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      label.setAttribute('x', lx);
      label.setAttribute('y', ly);
      label.setAttribute('fill', '#94a3b8');
      label.setAttribute('font-size', '11');
      label.setAttribute('font-weight', '600');
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('dominant-baseline', 'middle');
      label.textContent = deg + '°';
      ticksGroup.appendChild(label);
    }
  }

  function updateUI() {
    degreeText.textContent = currentDeg + '°';
    angleSlider.value = currentDeg;

    // スライダーの塗りつぶし割合
    const pct = (currentDeg / 360) * 100;
    angleSlider.style.background = `linear-gradient(to right, #2dd4bf ${pct}%, #2b354b ${pct}%)`;

    // バッジ更新
    const fracStr = fractionMap[currentDeg] ? `${fractionMap[currentDeg]} ・ ` : '';
    const dirStr = direction === 'L' ? '左回転' : '右回転';
    badgeText.textContent = fracStr + dirStr;

    // 分数ボタンのアクティブ状態
    fractionBtns.forEach(btn => {
      if (parseInt(btn.dataset.deg) === currentDeg) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    // 回転方向ボタンのアクティブ状態
    if (direction === 'L') {
      btnLeft.classList.add('active');
      btnRight.classList.remove('active');
    } else {
      btnRight.classList.add('active');
      btnLeft.classList.remove('active');
    }

    // SVG描画更新
    const signedDeg = direction === 'L' ? -currentDeg : currentDeg;
    const endRad = (signedDeg - 90) * Math.PI / 180;
    const endX = Math.cos(endRad) * radius;
    const endY = Math.sin(endRad) * radius;

    endLine.setAttribute('x2', endX);
    endLine.setAttribute('y2', endY);

    if (currentDeg === 0) {
      sectorPath.setAttribute('d', '');
      arcPath.setAttribute('d', '');
    } else if (currentDeg === 360) {
      sectorPath.setAttribute('d', `M 0 0 m -${radius}, 0 a ${radius},${radius} 0 1,0 ${radius * 2},0 a ${radius},${radius} 0 1,0 -${radius * 2},0`);
      arcPath.setAttribute('d', `M 0 -${radius} A ${radius} ${radius} 0 1 1 -0.01 -${radius}`);
    } else {
      const largeArcFlag = currentDeg > 180 ? 1 : 0;
      const sweepFlag = direction === 'R' ? 1 : 0;

      const dSector = [
        `M 0 0`,
        `L 0 -${radius}`,
        `A ${radius} ${radius} 0 ${largeArcFlag} ${sweepFlag} ${endX} ${endY}`,
        `Z`
      ].join(' ');

      const dArc = [
        `M 0 -${radius}`,
        `A ${radius} ${radius} 0 ${largeArcFlag} ${sweepFlag} ${endX} ${endY}`
      ].join(' ');

      sectorPath.setAttribute('d', dSector);
      arcPath.setAttribute('d', dArc);
    }
  }

  angleSlider.addEventListener('input', (e) => {
    currentDeg = parseInt(e.target.value);
    updateUI();
  });

  fractionBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      currentDeg = parseInt(btn.dataset.deg);
      updateUI();
    });
  });

  btnLeft.addEventListener('click', () => {
    direction = 'L';
    updateUI();
  });

  btnRight.addEventListener('click', () => {
    direction = 'R';
    updateUI();
  });

  initDial();
  updateUI();
</script>
</body>
</html>
